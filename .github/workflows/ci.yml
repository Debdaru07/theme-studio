name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: JS / TS (schema, API, SDKs, admin, docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit (high and critical)
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - name: Shared fixtures are up to date
        run: |
          npm run fixtures
          git diff --exit-code -- packages/schema
      - name: Packages build for publishing
        run: for p in schema web react react-native; do node scripts/pack.mjs "$p"; done
      - name: Build Theme Studio
        run: npm run build -w @dts/admin
      - name: Build docs site
        run: npm run build -w @dts/site

  flutter:
    name: Flutter SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.38.9
          channel: stable
          cache: true
      - name: Fixtures synced from packages/schema
        run: |
          dart tool/sync_fixtures.dart
          git diff --exit-code -- .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Example app
        working-directory: sdks/flutter/example
        run: |
          flutter pub get
          flutter analyze
          flutter test
